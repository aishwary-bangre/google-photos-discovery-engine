name: Build MVP scene library

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - run: python scripts/fetch_scenes.py 2>&1 | tee mvp_scenes_log.txt
      - name: Commit
        run: |
          git config user.name "discovery-engine-bot"
          git config user.email "actions@users.noreply.github.com"
          git add mvp/library
          git commit -m "MVP: fetch scene photos from Wikimedia Commons" || echo "nothing to commit"
          for i in 1 2 3; do git pull --rebase -X theirs origin main && git push && break; sleep 5; done
